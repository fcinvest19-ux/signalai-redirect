<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>SignalAi devient OpportIA</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://opportia.fr/" />
  <!-- S305.1 : signalai.fr → opportia.fr. Le JS conserve le chemin ; le meta refresh couvre les navigateurs sans JS. -->
  <script>
    location.replace('https://opportia.fr' + location.pathname + location.search + location.hash);
  </script>
  <meta http-equiv="refresh" content="0; url=https://opportia.fr/" />
</head>
<body>
  <p>SignalAi devient OpportIA. Si la redirection ne se fait pas, rendez-vous sur <a href="https://opportia.fr/">opportia.fr</a>.</p>
</body>
</html>
